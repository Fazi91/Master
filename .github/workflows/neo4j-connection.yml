name: Neo4j Aura Connection Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Neo4j driver
        run: python -m pip install neo4j

      - name: Test Neo4j Aura connection
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from neo4j import GraphDatabase

          uri = os.getenv("NEO4J_URI")
          username = os.getenv("NEO4J_USERNAME")
          password = os.getenv("NEO4J_PASSWORD")

          missing = [
              name for name, value in {
                  "NEO4J_URI": uri,
                  "NEO4J_USERNAME": username,
                  "NEO4J_PASSWORD": password,
              }.items() if not value
          ]
          if missing:
              raise RuntimeError("Missing GitHub secrets: " + ", ".join(missing))

          driver = GraphDatabase.driver(uri, auth=(username, password))
          try:
              driver.verify_connectivity()
              with driver.session() as session:
                  value = session.run(
                      "RETURN 1 AS connection_test"
                  ).single()["connection_test"]
              assert value == 1
              print("SUCCESS: GitHub Actions connected to Neo4j Aura.")
          finally:
              driver.close()
          PY
          
