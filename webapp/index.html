<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Laboratory Assistant</title>
  <style>
    :root{--blue:#1769e0;--dark:#17243b;--muted:#71809a;--soft:#f2f7ff;--line:#dbe7f8}*{box-sizing:border-box}body{margin:0;color:var(--dark);font-family:Inter,Segoe UI,Arial,sans-serif;background:#fff}header{height:70px;display:flex;align-items:center;gap:11px;padding:0 28px;border-bottom:1px solid #e8eef7}.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--blue);color:#fff;font-weight:800}header strong,header span{display:block}header strong{font-size:14px}header span{margin-top:2px;color:#6082ad;font-size:11px}.page{width:min(820px,calc(100% - 32px));margin:auto;padding:18vh 0 70px}.page.active{padding-top:52px}.intro{text-align:center;margin-bottom:27px}.intro h1{margin:0 0 9px;font-size:34px}.intro p{margin:0;color:var(--muted);font-size:14px}.ask{display:flex;gap:10px;padding:11px 11px 11px 18px;border:1.5px solid #b8cce9;border-radius:15px;box-shadow:0 10px 35px #1a61bd14}.ask:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px #e3efff}.ask input{flex:1;border:0;outline:0;font-size:15px}.ask button{min-width:64px;height:40px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.ask button:disabled{background:#c9d4e3}.result{display:none;margin-top:28px}.result.show{display:block}.question{padding:15px 18px;border-radius:12px;background:var(--soft)}.label{color:#6680a4;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.question p{margin:5px 0 0;font-size:14px}.card{margin-top:16px;padding:21px 23px;border:1px solid var(--line);border-radius:14px}.answer{border-left:4px solid var(--blue)}h2{margin:0;color:var(--blue);font-size:13px}.answer p{margin:11px 0 0;line-height:1.75;font-size:15px;white-space:pre-line}.details{display:grid;grid-template-columns:1.12fr .88fr;gap:16px}.source,.images{padding:20px}.source-row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #edf2f9;font-size:12px}.source-row span{color:var(--muted)}.source-row b{text-align:right}.quote{margin-top:14px;padding:11px 13px;border-radius:8px;background:var(--soft);color:#60718a;font-size:11px;line-height:1.55}.graph{margin-top:10px;padding:10px 12px;border:1px dashed #b7cae6;border-radius:8px;color:#48678f;font:11px/1.5 Consolas,monospace;overflow-wrap:anywhere}.review{padding:20px}.summary{margin:13px 0;padding:12px 14px;border-radius:9px;background:var(--soft);font-size:12px;line-height:1.6}.evidence-item{margin-top:12px;padding:14px;border:1px solid #e4ecf7;border-radius:10px}.evidence-head{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px}.badge{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase}.badge.used{background:#def7e8;color:#197443}.badge.supporting{background:#e7f0ff;color:#225da8}.badge.rejected{background:#f2f3f5;color:#6e7784}.reason{margin-top:8px;color:var(--muted);font-size:11px;line-height:1.5}.image-list{margin-top:15px;display:grid;gap:10px}.image-list img{width:100%;max-height:230px;object-fit:contain;border-radius:9px;background:var(--soft)}.empty{margin-top:15px;color:var(--muted);font-size:12px}.loading{display:none;text-align:center;padding:45px;color:var(--blue)}.loading.show{display:block}.error{margin-top:18px;padding:13px;border-radius:10px;background:#fff1f1;color:#a22;font-size:13px}@media(max-width:680px){header{height:62px;padding:0 16px}.page,.page.active{width:calc(100% - 24px);padding-top:42px}.page:not(.active){padding-top:14vh}.intro h1{font-size:29px}.details{grid-template-columns:1fr}.ask{padding-left:14px}.ask button{min-width:56px}}
  </style>
</head>
<body>
  <header><div class="logo">L</div><div><strong>Laboratory Assistant</strong><span>Evidence-grounded with Neo4j Graph V2</span></div></header>
  <main class="page" id="page">
    <section class="intro" id="intro"><h1>Ask a question</h1><p>The answer, exact source location and related image will appear together.</p></section>
    <form class="ask" id="askForm"><input id="query" placeholder="Ask about the laboratory manual..." autocomplete="off"><button id="askButton">Ask</button></form>
    <div class="loading" id="loading">Searching the manual and Neo4j…</div>
    <section class="result" id="result">
      <div class="question"><span class="label">Your question</span><p id="shownQuestion"></p></div>
      <article class="card answer"><h2>Answer</h2><p id="answer"></p></article>
      <div class="details" id="details">
        <article class="card source"><h2>Source location</h2><div id="source"></div></article>
        <article class="card images"><h2>Related image evidence</h2><div class="image-list" id="images"></div></article>
      </div>
      <div id="retrievalSummary"></div>
    </section>
    <div id="error"></div>
  </main>
  <script>
    const form=document.getElementById('askForm'),input=document.getElementById('query'),button=document.getElementById('askButton'),page=document.getElementById('page'),intro=document.getElementById('intro'),loading=document.getElementById('loading'),result=document.getElementById('result'),details=document.getElementById('details'),error=document.getElementById('error');
    form.addEventListener('submit',async(e)=>{e.preventDefault();const query=input.value.trim();if(!query)return;button.disabled=true;loading.classList.add('show');result.classList.remove('show');error.innerHTML='';intro.style.display='none';page.classList.add('active');try{const response=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});const payload=await response.json();if(!response.ok)throw new Error(payload.detail||'Request failed');const data=payload;document.getElementById('shownQuestion').textContent=data.question;document.getElementById('answer').textContent=data.answer;const isDomain=data.kind==='domain_answer';details.style.display=isDomain?'grid':'none';if(isDomain){const sources=Array.isArray(data.sources)?data.sources:[];const source=document.getElementById('source');source.innerHTML=sources.length?sources.map((s,index)=>`<div class="source-row"><span>Source</span><b>${index+1}</b></div><div class="source-row"><span>Chunk</span><b>${safe(s.chunk_id)}</b></div><div class="source-row"><span>PDF page</span><b>${safe(s.pdf_page)}</b></div><div class="source-row"><span>Printed page</span><b>${safe(s.printed_page||'—')}</b></div><div class="source-row"><span>Retrieval confidence</span><b>${safe(s.confidence)}</b></div><div class="quote">${safe(s.evidence)}</div><div class="graph"><b>Neo4j location</b><br>${safe(s.graph_location)}</div>`).join(''):'<div class="empty">No source location found.</div>';const imageRows=Array.isArray(data.images)?data.images:[];const images=document.getElementById('images');images.innerHTML=imageRows.length?imageRows.map(i=>`<img src="${safe(i.url)}" alt="Verified related image from PDF page ${safe(i.pdf_page)}"><div class="source-row"><span>Image ID</span><b>${safe(i.id)}</b></div><div class="source-row"><span>Linked chunk</span><b>${safe(i.chunk_id)}</b></div><div class="source-row"><span>PDF page</span><b>${safe(i.pdf_page)}</b></div><div class="source-row"><span>Image type</span><b>${safe(i.type)}</b></div><div class="source-row"><span>Semantic score</span><b>${safe(i.confidence)}</b></div>`).join(''):'<div class="empty">No verified image is linked to this answer.</div>'}const summary=data.retrieval_summary||{};document.getElementById('retrievalSummary').innerHTML=isDomain?`<div class="summary">Neo4j verification: <b>${safe(summary.neo4j_verification)}</b> · <b>${safe(summary.chunks_scanned||0)}</b> chunks scanned · <b>${safe(summary.sources_used||0)}</b> best source chunk(s) shown</div>`:'';result.classList.add('show');input.value='';input.focus()}catch(err){error.innerHTML=`<div class="error">${safe(err.message)}</div>`}finally{loading.classList.remove('show');button.disabled=false;input.focus()}});
    function safe(value){const div=document.createElement('div');div.textContent=value??'—';return div.innerHTML}
  </script>
</body>
</html>
